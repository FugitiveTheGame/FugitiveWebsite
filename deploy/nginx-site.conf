# fugitivethegame.online — static pages plus a few PHP endpoints.
# Installed by install.sh as /etc/nginx/sites-available/fugitivethegame.online.
# certbot --nginx adds the 443 blocks and the http->https redirect on top.
#
# The docroot is www/ inside the checkout. Everything the PHP requires
# (includes/, templates/, vendor/, keys.json) sits one level above it in
# /home/fugitive/site, which is how the code resolves it and keeps the
# database credentials out of reach of the web server.
server {
	listen 80;
	listen [::]:80;
	server_name fugitivethegame.online www.fugitivethegame.online;

	root /home/fugitive/site/www;
	index index.html index.php;

	# In-game crash reports POST gzipped logs, which run larger than the 1M default.
	client_max_body_size 12m;

	include snippets/fugitive-deploy.conf;

	# Extensionless URLs, which the old Apache .htaccess used to provide:
	# /fugitive-3d -> fugitive-3d.html, /gamestats -> gamestats.php.
	location / {
		try_files $uri $uri/ $uri.html $uri.php =404;
	}

	# "^~" stops the "\.php$" regex location below from being chosen for
	# /management/*.php, which would hand out the admin UI with no password.
	location ^~ /management {
		auth_basic "Do I know you?";
		auth_basic_user_file /home/fugitive/.htpasswd;

		try_files $uri $uri/ $uri.php =404;

		location ~ \.php$ {
			auth_basic "Do I know you?";
			auth_basic_user_file /home/fugitive/.htpasswd;
			include snippets/fastcgi-php.conf;
			fastcgi_pass unix:/run/php/php8.5-fpm-fugitive.sock;
		}
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php8.5-fpm-fugitive.sock;
	}

	# The game clients poll this for updates; it must never be cached stale.
	location = /latest_version.json {
		add_header Cache-Control "no-cache";
	}

	location ~* \.(?:jpe?g|png|gif|webp|svg|ico|woff2?|css|js)$ {
		expires 7d;
		add_header Cache-Control "public";
	}

	# .htaccess ships in the repo for anyone running this under Apache.
	location ~ /\. {
		deny all;
	}

	access_log /var/log/nginx/fugitivethegame.online.access.log;
	error_log /var/log/nginx/fugitivethegame.online.error.log;
}
