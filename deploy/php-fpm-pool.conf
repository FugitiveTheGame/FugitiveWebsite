[fugitive]
user = fugitive
group = fugitive
listen = /run/php/php8.5-fpm-fugitive.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; NotORM is unmaintained and trips a PHP 8 deprecation notice on every row
; access. Without this the error log fills with them on each page view.
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

; In-game crash reports arrive as base64'd gzip in a POST body.
php_admin_value[post_max_size] = 12M
php_admin_value[upload_max_filesize] = 12M
